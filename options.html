<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Jira Standup Order Locker Options</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-width: 320px;
        padding: 18px;
      }

      h1 {
        font-size: 16px;
        margin: 0 0 14px;
      }

      label {
        align-items: flex-start;
        display: flex;
        gap: 10px;
        line-height: 1.4;
      }

      label + label {
        margin-top: 14px;
      }

      input {
        margin-top: 3px;
      }

      .title {
        display: block;
        font-weight: 600;
      }

      .description {
        color: #6b7280;
        display: block;
        font-size: 13px;
        margin-top: 3px;
      }

      .status {
        color: #6b7280;
        font-size: 12px;
        min-height: 16px;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Jira Standup Order Locker</h1>
    <label>
      <input id="expand-board-assignees" type="checkbox" checked>
      <span>
        <span class="title">Show all board assignees</span>
        <span class="description">Displays every assignee in a horizontally scrollable row below the board controls.</span>
      </span>
    </label>
    <label>
      <input id="clear-board-filters" type="checkbox">
      <span>
        <span class="title">Clear Jira board filters on refresh</span>
        <span class="description">Clicks Jira's Clear filters control after a board page is opened with active filters.</span>
      </span>
    </label>
    <div id="status" class="status"></div>
    <script src="options.js"></script>
  </body>
</html>
